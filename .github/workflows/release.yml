name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: go test -race ./... && go vet ./...
      - run: npm ci && npm run css && python3 scripts/third-party-notices.py
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.45.1
      - run: VERSION="${GITHUB_REF_NAME#v}" scripts/release.sh
      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.rpm dist/*.deb dist/SHA256SUMS \
            --verify-tag --prerelease --title "GHole $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
