name: Ошибка
description: Сообщить о воспроизводимой ошибке gdns
title: '[Bug] '
body:
  - type: textarea
    id: environment
    attributes:
      label: Версия gdns и окружение
      description: ОС, архитектура, SQLite/PostgreSQL, DNS-транспорт. Секреты не прикладывайте.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги воспроизведения и ожидаемый результат
    validations:
      required: true
