name: ghole
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1.${DISTRO}
section: net
priority: optional
maintainer: 'Кислов Роман Сергеевич <20784137+rkislov@users.noreply.github.com>'
description: |
  Go DNS resolver with authoritative zones, source-CIDR split records,
  block feeds, SQLite/PostgreSQL, DoH/DoT and an embedded admin UI.
vendor: 'Кислов Роман Сергеевич'
homepage: https://github.com/rkislov/ghole
license: Apache-2.0
depends:
  - systemd
contents:
  - src: ./dist/ghole_linux_${ARCH}
    dst: /usr/bin/ghole
    file_info:
      mode: 0755
  - src: ./packaging/systemd/ghole.service
    dst: /usr/lib/systemd/system/ghole.service
  - src: ./LICENSE
    dst: /usr/share/doc/ghole/LICENSE
  - src: ./NOTICE
    dst: /usr/share/doc/ghole/NOTICE
  - src: ./THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/ghole/THIRD_PARTY_NOTICES.txt
  - src: ./README.md
    dst: /usr/share/doc/ghole/README.md
  - src: ./docs/linux-installation.md
    dst: /usr/share/doc/ghole/linux-installation.md
scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
