name: gdns
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1.${DISTRO}
section: net
priority: optional
maintainer: 'Кислов Роман Сергеевич <roman@kislovs.ru>'
description: |
  Go DNS resolver with authoritative zones, source-CIDR split records,
  block feeds, SQLite/PostgreSQL, DoH/DoT and an embedded admin UI.
vendor: 'Кислов Роман Сергеевич'
homepage: https://github.com/rkislov/gdns
license: Apache-2.0
depends:
  - systemd
contents:
  - src: ./dist/gdns_linux_${ARCH}
    dst: /usr/bin/gdns
    file_info:
      mode: 0755
  - src: ./packaging/systemd/gdns.service
    dst: /usr/lib/systemd/system/gdns.service
  - src: ./LICENSE
    dst: /usr/share/doc/gdns/LICENSE
  - src: ./NOTICE
    dst: /usr/share/doc/gdns/NOTICE
  - src: ./THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/gdns/THIRD_PARTY_NOTICES.txt
  - src: ./README.md
    dst: /usr/share/doc/gdns/README.md
  - src: ./docs/linux-installation.md
    dst: /usr/share/doc/gdns/linux-installation.md
scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
